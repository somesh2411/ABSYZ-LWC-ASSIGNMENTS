<template>
    <lightning-card title="Create Contact" icon-name="standard:contact">
        <div class="form-container">
            <div class="form-row">
                <lightning-input label="First Name" value={firstName} data-field="FirstName" onchange={handleInputChange}></lightning-input>
            </div>
            <div class="form-row">
                <lightning-input label="Last Name" value={lastName} required data-field="LastName" onchange={handleInputChange}></lightning-input>
            </div>
            <div class="form-row">
                <lightning-input type="email" label="Email" value={email} required data-field="Email" onchange={handleInputChange}></lightning-input>
            </div>
            <div class="form-row">
                <lightning-input type="date" label="Birthdate" value={birthdate} data-field="Birthdate" onchange={handleInputChange}></lightning-input>
            </div>
            <div class="form-row">
                <lightning-input type="tel" label="Phone Number" value={phone} data-field="Phone" onchange={handleInputChange}></lightning-input>
            </div>
            <template lwc:if={errorMessage}>
                <div class="error-banner">
                    {errorMessage}
                </div>
            </template>
            <div class="button-row">
                <lightning-button variant="brand" label="Save"  onclick={handleSave} disabled={isLoading}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
