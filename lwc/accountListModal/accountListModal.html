<template>
    <lightning-card title="Account List" icon-name="standard:account">
        <div class="slds-var-p-around_medium">
            <template lwc:if={accounts}>
                <ul class="slds-has-dividers_bottom-space">
                    <template for:each={accounts} for:item="acc">
                        <li key={acc.Id} class="slds-item slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-p-vertical_x-small">
                            <span class="slds-text-heading_small">{acc.Name}</span>
                            <lightning-button 
                                label="Show Details" 
                                variant="neutral" 
                                data-id={acc.Id} 
                                onclick={handleShowDetails}>
                            </lightning-button>
                        </li>
                    </template>
                </ul>
            </template>

            <template lwc:if={error}>
                <p class="slds-text-color_error">Error loading accounts.</p>
            </template>
        </div>
    </lightning-card>

    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Account Details</h2>
                </header>

                <div class="slds-modal__content slds-var-p-around_medium">
                    <div class="slds-form" role="list">
                        <div class="slds-form__row">
                            <div class="slds-form__item">
                                <span class="slds-form-element__label">Account Name:</span>
                                <div class="slds-form-element__control">{selectedAccount.Name}</div>
                            </div>
                        </div>
                        <div class="slds-form__row">
                            <div class="slds-form__item">
                                <span class="slds-form-element__label">Account Number:</span>
                                <div class="slds-form-element__control">{selectedAccount.AccountNumber}</div>
                            </div>
                        </div>
                        <div class="slds-form__row">
                            <div class="slds-form__item">
                                <span class="slds-form-element__label">Industry:</span>
                                <div class="slds-form-element__control">{selectedAccount.Industry}</div>
                            </div>
                        </div>
                        <div class="slds-form__row">
                            <div class="slds-form__item">
                                <span class="slds-form-element__label">Type:</span>
                                <div class="slds-form-element__control">{selectedAccount.Type}</div>
                            </div>
                        </div>
                        <div class="slds-form__row">
                            <div class="slds-form__item">
                                <span class="slds-form-element__label">Phone:</span>
                                <div class="slds-form-element__control">{selectedAccount.Phone}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Close" variant="brand" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
