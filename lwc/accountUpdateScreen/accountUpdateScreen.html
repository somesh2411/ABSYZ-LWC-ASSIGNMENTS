<template>
    <div class="slds-box slds-theme_default slds-var-p-around_medium">
        <h2 class="slds-text-heading_medium slds-text-title_bold slds-var-m-bottom_medium">
            Account Record Details
        </h2>

        <lightning-record-edit-form 
            record-id={recordId}
            object-api-name="Account"
            onsuccess={handleSuccess}
            onerror={handleError}>
            
            <lightning-messages></lightning-messages>

            <lightning-input-field field-name="Name" required></lightning-input-field>
            <lightning-input-field field-name="Type"></lightning-input-field>
            <lightning-input-field field-name="Industry"></lightning-input-field>

            <div class="slds-align_absolute-center slds-var-m-top_large">
                <lightning-button 
                    label="Cancel" 
                    variant="neutral" 
                    onclick={handleCancel}
                    class="slds-var-m-right_x-small">
                </lightning-button>
                <lightning-button 
                    type="submit" 
                    label="Save" 
                    variant="brand">
                </lightning-button>
            </div>
        </lightning-record-edit-form>
    </div>
</template>
