<template>
    <div class="slds-box slds-theme_default slds-var-p-around_medium">
        <h2 class="slds-text-heading_medium slds-text-title_bold slds-var-m-bottom_medium">
            Contact Record Creation
        </h2>
        <lightning-record-edit-form 
            object-api-name="Contact"
            onsuccess={handleSuccess}
            onerror={handleError}>
            
            <lightning-messages></lightning-messages>

            <lightning-input-field field-name="FirstName"></lightning-input-field>
            <lightning-input-field field-name="LastName" required></lightning-input-field>
            <lightning-input-field field-name="Email"></lightning-input-field>
            <lightning-input-field field-name="Phone"></lightning-input-field>

            <!-- Hidden field to bind Contact to current Account -->
            <lightning-input-field field-name="AccountId" value={accountId} class="slds-hide"></lightning-input-field>

            <div class="slds-align_absolute-center slds-var-m-top_large">
                <lightning-button 
                    label="Cancel" 
                    variant="neutral" 
                    onclick={handleCancel}
                    class="slds-var-m-right_x-small">
                </lightning-button>
                <lightning-button 
                    type="submit" 
                    label="Save" 
                    variant="brand">
                </lightning-button>
            </div>
        </lightning-record-edit-form>
    </div>
</template>
