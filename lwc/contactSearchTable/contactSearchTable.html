<template>
    <lightning-card title="Search Contact">
        <div class="slds-var-p-around_medium">
            <lightning-input 
                type="search" 
                label="Enter the Search Text" 
                value={searchKey} 
                onchange={handleSearchChange} 
                placeholder="Type to search...">
            </lightning-input>
            <template lwc:if={firstContact}>
                <div class="slds-var-m-vertical_small">
                    <p>Name : {firstContact.Name}</p>
                    <p>Phone : {firstContact.Phone}</p>
                    <p>Email : {firstContact.Email}</p>
                </div>
            </template>
            <template lwc:if={contacts.data}>
                <div class="slds-var-m-top_small">
                    <lightning-datatable
                        key-field="Id"
                        data={contacts.data}
                        columns={columns}>
                    </lightning-datatable>
                </div>
            </template>
            <template lwc:if={contacts.error}>
                <p class="slds-text-color_error slds-var-m-top_small">
                    Error searching contacts.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
