<template>
    <lightning-card title="Create Record Using lightning/uiRecordApi" icon-name="standard:record">
        <div class="slds-var-p-around_medium">
            <lightning-input 
                label="Name" 
                name="accountName" 
                value={accountName} 
                onchange={handleNameChange}
                required>
            </lightning-input>

            <lightning-input 
                label="Rating" 
                name="accountRating" 
                value={accountRating} 
                onchange={handleRatingChange}
                class="slds-var-m-top_small">
            </lightning-input>
            <div class="slds-var-m-top_medium">
                <lightning-button 
                    variant="brand" 
                    label="Create Account" 
                    onclick={handleCreateAccount}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
