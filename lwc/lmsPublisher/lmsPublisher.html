<template>
    <lightning-card title="LMS Publisher Component" icon-name="custom:custom18">
        <div class="slds-var-p-around_medium">
            <!-- Input Text Box -->
            <lightning-input 
                label="Message" 
                value={messageText} 
                onchange={handleInputChange} 
                placeholder="Enter message here...">
            </lightning-input>

            <!-- Button to fire the Event -->
            <div class="slds-var-m-top_medium">
                <lightning-button 
                    variant="brand" 
                    label="Publish Message" 
                    onclick={handlePublish}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
